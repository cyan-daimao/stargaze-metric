spring:
  config:
    import:
      - "nacos:arch-base.yaml?group=DEFAULT_GROUP&namespace=dev"
      - "nacos:stargaze-metric.yaml?group=DEFAULT_GROUP&namespace=dev"
  cloud:
    nacos:
      server-addr: 10.0.0.2:8848
      username: nacos
      password: nacos
      config:
        file-extension: yaml
        namespace: dev
      discovery:
        ephemeral: true
        namespace: dev
  # 元数据库 PostgreSQL(观星元数据 + pgvector 向量)
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://10.0.0.2:5432/stargaze?currentSchema=stargaze_metric
    username: postgres
    password: postgres
  # MyBatis-Plus
  data:
    redis:
      host: 10.0.0.2
      port: 6379

# 跨服务调用 dataset 通过 Nacos 服务发现，无需显式配置 url
